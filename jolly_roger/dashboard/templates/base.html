<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jolly Roger — Review Replies</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; max-width: 760px;
           margin: 2rem auto; padding: 0 1rem; color: #222; }
    a { color: #1a73e8; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem;
            margin: 1rem 0; }
    .stars { color: #e8a33d; font-size: 1.1rem; }
    .flag { color: #b00; font-weight: bold; }
    .draft { background: #f6f6f6; padding: .75rem; border-radius: 6px; }
    textarea { width: 100%; min-height: 7rem; font: inherit; padding: .5rem; }
    button { font: inherit; padding: .5rem .9rem; border-radius: 6px;
             border: 0; cursor: pointer; }
    .approve { background: #1a73e8; color: #fff; }
    .reject  { background: #eee; color: #333; }
    .muted { color: #888; }
    .error { background: #fdecea; color: #b00; padding: .75rem;
             border-radius: 6px; }
  </style>
</head>
<body>
  <h1><a href="{{ url_for('index') }}">Jolly Roger</a> — Review Replies</h1>
  {% block content %}{% endblock %}
</body>
</html>
